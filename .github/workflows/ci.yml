name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: microsoft/setup-msbuild@v2
      - name: Build x64 Release
        run: msbuild TagEssentials.sln /m /p:Configuration=Release /p:Platform=x64

  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
